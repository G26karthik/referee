; Makes `single-harness/` its own pytest rootdir.
;
; This is load-bearing, not cosmetic. The repo-root `conftest.py` calls
; `shared.dev_env.apply_worktree_test_env()`, which calls
; `ensure_worktree_test_db()`, which OPENS A POSTGRES CONNECTION. Without an
; inifile here, pytest resolves rootdir to the repo root, loads that conftest as
; an ancestor, and the whole single-harness suite dies with
; `psycopg2.OperationalError: connection refused` unless the dev stack is up.
;
; Because this file exists, rootdir (and therefore confcutdir) is
; `single-harness/`, so the repo-root conftest is never imported and these tests
; need no database, no docker, and no worktree env.
;
; Run them explicitly (from either the repo root or here):
;     uv run pytest single-harness/tests -q
;
; Deliberately NOT added to the repo-root `[tool.pytest.ini_options] testpaths`
; — `single-harness/` is not a uv workspace member, and pulling an un-packaged
; directory into `make test` / `make pre-pr` would break CI.
[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    docker: needs a reachable container runtime. Skipped automatically when the daemon
        is not up, so the suite stays green on a machine without Docker Desktop running.
        Deselect deliberately with `-m "not docker"`; these are the only tests that
        actually start a container, and the properties they check are the ones no pure
        test can establish.
